# AutoGluon best_quality: ETTm1
# ================================
# Purpose: produce non-trivial Rashomon sets via bagging+stacking.
# n_splits=3 → 2 pairwise stability comparisons per (seed, eps).
# Split math: need = min_train(27869) + val(10450) + test(10450) × n_splits(3) = 69669
# ETTm1 has 69680 total 15-min observations → 11 observations headroom (very tight).
#
# Usage:
#   python src/autogluon_pipeline.py --config configs/ag/bq/ettm1.yaml
#
# SLURM: cpu-zen4; 3 splits × 3 seeds × 1800s ≈ 5h (exceeds cpu-short 4h limit)

project:
  outdir: results
  run_name: bq_ettm1
  random_seed: 42

data:
  source: "benchmark"

  benchmark:
    name: "ETTm1"
    cache_dir: "data/benchmark_cache"

  horizon: 1
  target_lags: 6
  cov_lag: 1
  freq: "15T"

splits:
  n_splits: 3
  min_train_time: 27869
  val_size: 10450
  test_size: 10450

automl:
  time_limit_s: 1800
  presets: "best_quality"
  seeds: [0, 1, 2]
  eval_metric: "mae"
  max_models_per_rashomon: 20
  num_gpus: "auto"
  num_cpus: "auto"
  fit_strategy: "sequential"
  verbosity: 2

rashomon:
  eps_list: [0.02, 0.05, 0.10, 0.20, 0.30]

shap:
  background_size: 50
  explain_size: 25
  max_evals: 300
  quantiles: [0.1, 0.5, 0.9]
  prefer_tree: true
  chunk_size: 25
  show_progress: true

report:
  topk_features: 10
  generate_plots: true
  generate_data_report: true
