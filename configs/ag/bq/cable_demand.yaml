# AutoGluon best_quality: Cable Demand
# ======================================
# Purpose: produce non-trivial Rashomon sets via bagging+stacking.
# n_splits=4 → 3 pairwise stability comparisons per (seed, eps).
# Split math: need = min_train(11) + val(3) + test(3) × n_splits(4) = 26 months
# Cable Demand has 34 common months → 8 months headroom.
# NOTE: test_size=3 months (30 tabularized rows) is below one seasonal cycle (12 months).
# Results are exploratory for RQ1; do not interpret as seasonal stability evidence.
#
# Usage:
#   python src/autogluon_pipeline.py --config configs/ag/bq/cable_demand.yaml
#
# SLURM: cpu-zen4; 4 splits × 3 seeds × 1800s ≈ 6h (exceeds cpu-short 4h limit)

project:
  outdir: results
  run_name: bq_cable_demand
  random_seed: 42

data:
  source: "real"

  real:
    panel_path: "data/processed/panel_final.parquet"
    metadata_path: "data/processed/feature_meta.parquet"
    target_col: "target"
    id_col: "item_id"
    time_col: "timestamp"

  horizon: 1
  target_lags: 6
  cov_lag: 1
  freq: "M"

splits:
  n_splits: 4
  min_train_time: 11
  val_size: 3
  test_size: 3

automl:
  time_limit_s: 1800
  presets: "best_quality"
  seeds: [0, 1, 2]
  eval_metric: "mae"
  max_models_per_rashomon: 20
  num_gpus: "auto"
  num_cpus: "auto"
  fit_strategy: "sequential"
  verbosity: 2

rashomon:
  eps_list: [0.02, 0.05, 0.10, 0.20, 0.30]

shap:
  # test fold = 3 months × 10 series = 30 tabularized rows; set sizes to match reality
  background_size: 25   # ~train set for smallest split (11 months × 10 series - lags)
  explain_size: 30      # full test fold (3 months × 10 series)
  max_evals: 400
  quantiles: [0.1, 0.5, 0.9]
  prefer_tree: true
  chunk_size: 30
  show_progress: true

report:
  topk_features: 15
  generate_plots: true
  generate_data_report: true
