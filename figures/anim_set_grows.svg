<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="As epsilon widens, more near-optimal models enter the Rashomon set, but the SHAP feature-importance ranking keeps the same order.">
  <style>
    text { fill: #3b4149; }
    .title { fill: #24292f; font-weight: 700; }
    .muted { fill: #8a8f98; }
    .axis  { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      text { fill: #adbac7; }
      .title { fill: #e6edf3; }
      .muted { fill: #768390; }
      .axis  { stroke: #444c56; }
    }
  </style>

  <text x="40" y="34" class="muted" font-size="13">More near-optimal models enter the Rashomon set, and the SHAP ranking keeps the same order.</text>

  <!-- LEFT: the Rashomon set -->
  <text x="60" y="92" class="title" font-size="13">The near-optimal set</text>
  <line x1="90" y1="110" x2="90" y2="300" class="axis" stroke-width="1.5"/>
  <text x="58" y="120" class="muted" font-size="10">worse</text>
  <text x="62" y="303" class="muted" font-size="10">best</text>
  <text x="30" y="215" class="muted" font-size="11" transform="rotate(-90 30 215)" text-anchor="middle">validation error (MAE)</text>
  <line x1="90" y1="290" x2="360" y2="290" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="2 3"/>

  <rect x="90" width="270" fill="#1F78B4" opacity="0.12">
    <animate attributeName="y" dur="7s" repeatCount="indefinite" keyTimes="0;0.62;0.80;1" values="272;150;150;272"/>
    <animate attributeName="height" dur="7s" repeatCount="indefinite" keyTimes="0;0.62;0.80;1" values="18;140;140;18"/>
  </rect>
  <line x1="90" x2="360" stroke="#1F78B4" stroke-width="1.6" stroke-dasharray="5 3">
    <animate attributeName="y1" dur="7s" repeatCount="indefinite" keyTimes="0;0.62;0.80;1" values="272;150;150;272"/>
    <animate attributeName="y2" dur="7s" repeatCount="indefinite" keyTimes="0;0.62;0.80;1" values="272;150;150;272"/>
  </line>
  <text x="366" y="160" fill="#1F78B4" font-size="11" font-weight="600">best MAE</text>
  <text x="366" y="174" fill="#1F78B4" font-size="11" font-weight="600">&#215; (1 + &#949;)</text>

  <text x="150" y="332" class="muted" font-size="12">&#949; :  0.02</text>
  <text x="206" y="332" class="muted" font-size="12">&#8594;</text>
  <text x="224" y="332" fill="#1F78B4" font-size="12" font-weight="700">0.30</text>

  <circle cx="150" cy="284" r="6" fill="#1F78B4"/>
  <circle cx="185" cy="278" r="6" fill="#1F78B4"/>
  <g>
    <circle cx="220" cy="262" r="6" fill="#c4ccd4"/>
    <circle cx="220" cy="262" r="6" fill="#1F78B4"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.14;0.15;0.80;1" values="0;0;1;1;0"/></circle>
  </g>
  <g>
    <circle cx="255" cy="238" r="6" fill="#c4ccd4"/>
    <circle cx="255" cy="238" r="6" fill="#1F78B4"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.28;0.29;0.80;1" values="0;0;1;1;0"/></circle>
  </g>
  <g>
    <circle cx="290" cy="212" r="6" fill="#c4ccd4"/>
    <circle cx="290" cy="212" r="6" fill="#1F78B4"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.42;0.43;0.80;1" values="0;0;1;1;0"/></circle>
  </g>
  <g>
    <circle cx="320" cy="186" r="6" fill="#c4ccd4"/>
    <circle cx="320" cy="186" r="6" fill="#1F78B4"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.55;0.56;0.80;1" values="0;0;1;1;0"/></circle>
  </g>
  <circle cx="250" cy="140" r="6" fill="#c4ccd4"/>

  <!-- CENTRE: aggregate -->
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8f98"/></marker>
  </defs>
  <line x1="392" y1="205" x2="452" y2="205" class="axis" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="422" y="192" class="muted" font-size="10" text-anchor="middle">explain each model,</text>
  <text x="422" y="228" class="muted" font-size="10" text-anchor="middle">average the ranks</text>

  <!-- RIGHT: SHAP ranking, order stays fixed -->
  <g transform="translate(470,0)">
    <text x="0" y="92" class="title" font-size="13">SHAP feature ranking</text>
    <g font-size="11">
      <text x="0" y="122">target_lag1</text>
      <rect x="92" y="112" height="12" rx="2" fill="#E8991C"><animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" values="176;168;176"/></rect>
      <text x="0" y="150">cov_lag1</text>
      <rect x="92" y="140" height="12" rx="2" fill="#E8991C" opacity="0.85"><animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" values="132;138;132"/></rect>
      <text x="0" y="178">hour_lag1</text>
      <rect x="92" y="168" height="12" rx="2" fill="#E8991C" opacity="0.7"><animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" values="96;92;96"/></rect>
      <text x="0" y="206">target_lag2</text>
      <rect x="92" y="196" height="12" rx="2" fill="#E8991C" opacity="0.55"><animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" values="70;74;70"/></rect>
      <text x="0" y="234">month_sin</text>
      <rect x="92" y="224" height="12" rx="2" fill="#E8991C" opacity="0.4"><animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" values="44;42;44"/></rect>
    </g>
    <g transform="translate(0,262)">
      <circle cx="8" cy="-4" r="8" fill="#1F78B4"/>
      <path d="M4,-4 L7,-1 L12,-8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="0" font-size="12" font-weight="600">temporal Spearman &#961; from 0.77 to 0.98 across all six datasets</text>
    </g>
  </g>
</svg>
